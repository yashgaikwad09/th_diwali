<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Diwali</title>
<style>
  :root{--gold:#ffd54a;--orange:#ff8a1f;--deep:#2a0a3d}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#6b1d5c 0%,var(--deep) 45%,#07010f 100%);font-family:Georgia,'Times New Roman',serif;color:#fff}
  canvas{position:fixed;inset:0}
  #fw{z-index:1}
  #petals{z-index:2;pointer-events:none}
  .center{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  h1{font-size:clamp(2.5rem,8vw,6.5rem);letter-spacing:.06em;color:var(--gold);
     text-shadow:0 0 12px var(--orange),0 0 40px #ff5a00,0 0 80px #ff3d00;animation:glow 2.4s ease-in-out infinite alternate}
  h2{font-weight:400;font-size:clamp(1rem,2.4vw,1.8rem);margin-top:.6rem;color:#ffe9b0;letter-spacing:.2em}
  p{margin-top:1.4rem;font-size:clamp(.9rem,1.6vw,1.2rem);opacity:.85;max-width:34rem;padding:0 1rem}
  @keyframes glow{from{filter:brightness(.9)}to{filter:brightness(1.25)}}
  .rangoli{position:fixed;left:50%;bottom:-120px;width:420px;height:420px;margin-left:-210px;z-index:2;opacity:.55;animation:spin 60s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .diyas{position:fixed;left:0;right:0;bottom:18px;z-index:4;display:flex;justify-content:space-evenly;pointer-events:none}
  .diya{position:relative;width:70px;height:34px}
  .diya .bowl{position:absolute;bottom:0;width:100%;height:60%;background:linear-gradient(#c8561b,#7a2a0a);border-radius:0 0 70px 70px / 0 0 100% 100%;box-shadow:0 0 24px 4px rgba(255,140,30,.5)}
  .diya .flame{position:absolute;left:50%;bottom:55%;width:16px;height:34px;margin-left:-8px;border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
     background:radial-gradient(circle at 50% 70%,#fff6c2 0%,#ffcf3a 40%,#ff7a00 80%);box-shadow:0 0 30px 12px rgba(255,160,40,.7);
     transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
  .diya:nth-child(even) .flame{animation-duration:.23s}
  @keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
  .garland{position:fixed;top:0;left:0;right:0;height:60px;z-index:4;pointer-events:none;
     background:repeating-radial-gradient(circle at 20px 10px,#ffb300 0 9px,#ff6d00 10px 14px,transparent 15px 40px);
     -webkit-mask:linear-gradient(#000 0 0);filter:drop-shadow(0 0 6px #ff9100)}
  #hint{position:fixed;top:70px;right:18px;z-index:5;font:12px sans-serif;opacity:.6}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<canvas id="petals"></canvas>
<div class="garland"></div>

<svg class="rangoli" viewBox="-100 -100 200 200">
  <g fill="none" stroke-width="1.6">
    <g stroke="#ff4d8d" id="ring">
      <circle r="90"/><circle r="70" stroke="#ffd54a"/><circle r="30" stroke="#7cf5ff"/>
    </g>
    <g stroke="#ffd54a"><path id="p" d="M0 -90 Q 18 -60 0 -30 Q -18 -60 0 -90Z"/></g>
    <g stroke="#ff8a1f">
      <use href="#p" transform="rotate(30)"/><use href="#p" transform="rotate(60)"/><use href="#p" transform="rotate(90)"/>
      <use href="#p" transform="rotate(120)"/><use href="#p" transform="rotate(150)"/><use href="#p" transform="rotate(180)"/>
      <use href="#p" transform="rotate(210)"/><use href="#p" transform="rotate(240)"/><use href="#p" transform="rotate(270)"/>
      <use href="#p" transform="rotate(300)"/><use href="#p" transform="rotate(330)"/>
    </g>
  </g>
</svg>

<div class="center">
  <h1>Happy Diwali</h1>
  <h2>शुभ दीपावली</h2>
  <p>May the festival of lights fill your life with joy, prosperity and warmth.</p>
</div>

<div class="diyas" id="diyas"></div>
<div id="hint">Click anywhere for fireworks</div>

<script>
// ---- diyas ----
const d=document.getElementById('diyas');
for(let i=0;i<9;i++) d.insertAdjacentHTML('beforeend','<div class="diya"><div class="flame"></div><div class="bowl"></div></div>');

// ---- fireworks ----
const fw=document.getElementById('fw'),f=fw.getContext('2d');
const pt=document.getElementById('petals'),p=pt.getContext('2d');
let W,H;
function size(){W=fw.width=pt.width=innerWidth;H=fw.height=pt.height=innerHeight}
addEventListener('resize',size);size();
const colors=['#ffd54a','#ff8a1f','#ff4d8d','#7cf5ff','#b388ff','#69f0ae','#ffffff'];
let rockets=[],sparks=[];
function launch(x,y){
  rockets.push({x:x??Math.random()*W,y:H,ty:y??H*(.15+Math.random()*.4),vy:-9-Math.random()*3,c:colors[Math.random()*colors.length|0]});
}
function burst(x,y,c){
  const n=70+Math.random()*50|0, ring=Math.random()<.4;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n, s=ring?4:Math.random()*5+1;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.3?colors[Math.random()*colors.length|0]:c});
  }
}
addEventListener('click',e=>launch(e.clientX,e.clientY));
setInterval(()=>launch(),900);

// ---- marigold petals ----
const petals=Array.from({length:60},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:3+Math.random()*5,vy:.5+Math.random()*1.2,vx:Math.random()-.5,a:Math.random()*6,c:Math.random()<.6?'#ffa000':'#ff6d00'}));

function loop(){
  f.globalCompositeOperation='destination-out';f.fillStyle='rgba(0,0,0,.2)';f.fillRect(0,0,W,H);
  f.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{
    r.y+=r.vy;r.vy*=.985;
    f.fillStyle=r.c;f.beginPath();f.arc(r.x,r.y,2.2,0,7);f.fill();
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.c);return false}return true;
  });
  sparks=sparks.filter(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.vx*=.985;s.vy*=.985;s.life-=.012;
    f.globalAlpha=Math.max(s.life,0);f.fillStyle=s.c;f.beginPath();f.arc(s.x,s.y,1.8,0,7);f.fill();
    return s.life>0;
  });
  f.globalAlpha=1;

  p.clearRect(0,0,W,H);
  petals.forEach(q=>{
    q.y+=q.vy;q.x+=q.vx+Math.sin(q.a+=.02)*.6;
    if(q.y>H+10){q.y=-10;q.x=Math.random()*W}
    p.save();p.translate(q.x,q.y);p.rotate(q.a);p.fillStyle=q.c;p.globalAlpha=.85;
    p.beginPath();p.ellipse(0,0,q.r,q.r/2,0,0,7);p.fill();p.restore();
  });
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
